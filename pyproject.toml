[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmops-semantic-cache"
version = "0.1.0"
description = "Semantic caching layer for LLM APIs: embeddings, vector search, TTL, thresholds and cost metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Girish Kusanuramath", email = "girishkusanuramath@gmail.com" }]
keywords = ["llm", "semantic-cache", "llmops", "fastapi", "embeddings", "vector-search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<3.0",
]
sentence-transformers = ["sentence-transformers>=3.0,<6.0"]

[project.scripts]
llmops-cache = "llmops_cache.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that exercise several components together (no network)",
    "e2e: tests that run the full HTTP application (no network)",
    "neural: tests that load a real sentence-transformers model; need RUN_NEURAL_TESTS=1",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"examples/**" = ["S101"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["llmops_cache"]
warn_unused_ignores = true
# `mypy .` checks src/, scripts/ and examples/ strictly. Tests use untyped pytest fixtures
# and are deliberately not type-checked.
exclude = ['^tests/', '^\.venv/', '^build/', '^dist/']

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["llmops_cache"]
known-local-folder = ["helpers"]
