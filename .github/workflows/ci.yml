name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t llmops-semantic-cache:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 -e MOCK_LLM_LATENCY_MS=50 llmops-semantic-cache:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS -X POST http://127.0.0.1:8000/v1/chat -H 'Content-Type: application/json' -d '{"message":"What is machine learning?"}'
          curl -fsS -X POST http://127.0.0.1:8000/v1/chat -H 'Content-Type: application/json' -d '{"message":"Explain machine learning"}' | grep '"cache_hit":true'
          docker logs api
          docker rm -f api
